<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="flex gap-5">
    <div class="flex flex-col w-[30%] text-lg border-1 border-black items-center gap-5 py-10 h-screen">
        <label for="">Tarea:</label>
        <input type="text" class="border-1 border-blue-600 rounded-lg p-1" id="task">
        <label for="">Descripción:</label>
        <input type="text" class="border-1 border-blue-600 rounded-lg p-1" id="description">
        <label for="">Prioridad</label>
        <select name="" id="priority" class="border-1 border-blue-600 rounded-lg p-1">
            <option value="">Seleccione una opción</option>
            <option value="1">Baja</option>
            <option value="2">Media</option>
            <option value="3">Alta</option>
        </select>
        <button class="border-1 border-violet-500 bg-violet-300 w-[30%] rounded-lg cursor-pointer p-1"
            id="create">Crear</button>
        <p>Cantidad de tareas pendientes: <span id="pendientes"></span></p>
    </div>
    <div class="w-full grid grid-cols-4 gap-5" id="cards">

    </div>
    <script src="js/index.js"></script>
</body>

</html>
