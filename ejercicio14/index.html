<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
</head>

<body class="flex">
    <div class="w-[30%] border-r border-black h-screen">
        <div class="flex flex-col w-full gap-3 py-10 justify-center items-center h-[50%]">
            <label for="">Presupuesto</label>
            <input type="text" class="p-1 bg-green-200 rounded-lg caret-black w-[50%]" id="presupuesto">
            <button class="border-1 rounded-lg border-blue-500 bg-blue-300 p-1 w-[50%] cursor-pointer"
                id="butAddPr">Añadir
                presupuesto</button>
        </div>
        <div class="flex flex-col border-t w-full gap-3 py-10 justify-center items-center h-[50%]">
            <label for="">Nombre del gasto</label>
            <input type="text" class="bg-blue-300 w-[50%] rounded-lg p-1" id="nombreGs">
            <label for="">Valor del gasto</label>
            <input type="number" class="bg-blue-300 w-[50%] rounded-lg p-1" id="valGs">
            <button class="rounded-lg p-1 bg-green-300 border-1 border-green-500 w-[50%] cursor-pointer"
                id="addGas">Añadir
                gasto</button>
            <p class="text-red-500" id="super"></p>
        </div>
    </div>
    <div class="flex flex-col w-full border-b border-black p-10 gap-5">
        <p class="text-2xl place-self-end">Presupuesto: <span id="valor"></span></p>
        <div id="gastos">
            <table class="text-lg w-full table-fixed border-1">
                <thead>
                    <tr class="bg-gray-200">
                        <th class="border-1">Nombre del gasto</th>
                        <th class="border-1">Valor</th>
                    </tr>
                </thead>
                <tbody id="gastoContent" class="text-center">
                </tbody>
            </table>
        </div>
        <h2 class="text-2xl absolute inset-x-auto bottom-50 flex flex-col gap-5">Resumen:</h2>
        <div id="resumen" class="absolute inset-x-auto bottom-20 flex flex-col gap-5">
        </div>
    </div>

    <script src="js/index.js"></script>
</body>

</html>
