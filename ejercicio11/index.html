<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
</head>

<body class="flex gap-5">
    <form action="" class="flex flex-col gap-5">
        <div class="flex flex-col">
            <label for="">Nombre</label>
            <input type="text" class="border-1 rounded-lg" id="nombre">
            <p id="nombreError" class="text-red-500"></p>
        </div>
        <div class="flex flex-col">
            <label for="">Correo</label>
            <input type="text" class="border-1 rounded-lg" id="correo">
            <p id="correoError" class="text-red-500"></p>
        </div>
        <div class="flex flex-col">
            <label for="">Edad</label>
            <input type="number" class="border-1 rounded-lg" id="edad">
            <p id="edadError" class="text-red-500"></p>
        </div>
        <button type="button" class="border-1 border-blue-500 bg-blue-200 rounded-lg"
            id="registrarme">Registrarme</button>
        <p id="text"></p>
    </form>
    <script src="js/index.js"></script>
</body>

</html>
