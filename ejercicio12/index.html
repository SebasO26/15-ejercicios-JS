<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
</head>

<body class="flex gap-100">
    <div class="flex flex-col gap-5">
        <label for="">Ingresa la tabla de multiplicar que desees practicar:</label>
        <input type="number" id="numero" class="border-1 p-2">
        <button id="generar" class="border-1 border-green-500 bg-green-200">Generar</button>
    </div>
    <div>
        <table class="table-fixed w-[40%] border-1">
            <thead>
                <tr>
                    <th class="border-1">Número</th>
                    <th class="border-1">Multiplicador</th>
                    <th class="border-1">Total</th>
                </tr>
            </thead>
            <tbody id="multiplicar">
            </tbody>
        </table>
    </div>
    <script src="js/index.js"></script>
</body>

</html>
