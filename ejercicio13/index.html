<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de imágenes</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex justify-center items-center p-5">

    <main class="bg-white p-6 rounded-xl shadow-lg w-full max-w-2xl">

        <h1 class="text-2xl font-bold text-center mb-5">
            Mi galería de imágenes
        </h1>

        <div class="mb-5">
            <img id="imagenPrincipal" src="https://picsum.photos/id/10/800/500" alt="Imagen seleccionada"
                class="w-full h-72 object-cover rounded-lg">

            <h2 id="tituloImagen" class="text-xl font-semibold mt-3 text-center">
                Naturaleza
            </h2>
        </div>

        <div class="flex justify-center gap-3 flex-wrap">

            <img src="https://picsum.photos/id/10/800/500" alt="Naturaleza" data-titulo="Naturaleza"
                class="miniatura w-24 h-20 object-cover rounded-lg cursor-pointer border-4 border-blue-500">

            <img src="https://picsum.photos/id/15/800/500" alt="Montañas" data-titulo="Montañas"
                class="miniatura w-24 h-20 object-cover rounded-lg cursor-pointer border-4 border-transparent">

            <img src="https://picsum.photos/id/20/800/500" alt="Bosque" data-titulo="Bosque"
                class="miniatura w-24 h-20 object-cover rounded-lg cursor-pointer border-4 border-transparent">

            <img src="https://picsum.photos/id/25/800/500" alt="Paisaje" data-titulo="Paisaje"
                class="miniatura w-24 h-20 object-cover rounded-lg cursor-pointer border-4 border-transparent">

        </div>

    </main>

    <script src="js/index.js"></script>

</body>

</html>
