<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
</head>

<body class="flex gap-20">
    <div class="flex gap-10">
        <div class="flex flex-col gap-5">
            <label for="">Nombre</label>
            <input type="text" id="name">
            <label for="">Profesión</label>
            <input type="text" id="prof">
            <label for="">Url imagen</label>
            <input type="text" id="url">
            <button id="btn" class="border-1 rounded-lg p-2 cursor-pointer">Cambiar card</button>
        </div>
        <div id="card" class="size-200 border-1 rounded-lg flex flex-col justify-center items-center">
            <p id="nameCard">Nombre</p>
            <p id="profCard">Profesión</p>
            <img src="" alt="Perfil profesional" id="imgCard">
        </div>
    </div>

    <script src="js/index.js"></script>
</body>

</html>
